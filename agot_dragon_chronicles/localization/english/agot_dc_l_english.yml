l_english:
 # Modificateurs
 agot_dc_dragon_terror_modifier: "Terreur ailée"
 agot_dc_dragon_terror_modifier_desc: "Les survivants racontent partout comment ce personnage a brûlé des armées en fuite."
 agot_dc_dragon_blessed_modifier: "Dragon béni"
 agot_dc_dragon_blessed_modifier_desc: "Le dragon de ce personnage a reçu la bénédiction des dieux."
 agot_dc_dragon_scholar_modifier: "Étude draconique"
 agot_dc_dragon_scholar_modifier_desc: "Ce personnage finance l'étude savante de son dragon."
 agot_dc_dragon_merciful_modifier: "Cavalier clément"
 agot_dc_dragon_merciful_modifier_desc: "On loue ce cavalier de dragon pour sa retenue."
 agot_dc_dragon_festival_modifier: "Fête du Dragon"
 agot_dc_dragon_festival_modifier_desc: "Le peuple célèbre le dragon de son seigneur."
 agot_dc_dragon_feared_county_modifier: "Ombre du Dragon"
 agot_dc_dragon_feared_county_modifier_desc: "Le peuple tremble, mais les hommes s'enrôlent par peur."

 # 0001

 # 0011

 # 0021
 agot_dc.0021.t: "Les dieux et le dragon"
 agot_dc.0021.desc: "Un prêtre de votre foi demande à bénir [dc_dragon.GetFirstName] devant la foule, pour montrer que le feu du dragon sert la volonté divine."
 agot_dc.0021.a: "Qu'il le bénisse."
 agot_dc.0021.b: "Mon dragon n'a besoin d'aucun dieu."
 agot_dc.0021.c: "Laissez-le donc offrir sa colombe… au dragon."

 # 0031
 agot_dc.0031.t: "Le savant et la bête"
 agot_dc.0031.desc: "Un érudit venu de la Citadelle supplie qu'on le laisse étudier [dc_dragon.GetFirstName] : ses écailles, son feu, son sommeil. Il prétend retrouver des savoirs perdus de Valyria."
 agot_dc.0031.a: "Je financerai ses recherches."
 agot_dc.0031.b: "Qu'il regarde, de loin."
 agot_dc.0031.b.fine: "Il remplit des carnets entiers, ravi."
 agot_dc.0031.b.eaten: "Il s'approche un peu trop. On ne retrouve que ses carnets."
 agot_dc.0031.c: "Dehors, charlatan."

 # 0041
 agot_dc.0041.t: "Un festin chez le voisin"
 agot_dc.0041.desc: "[dc_dragon.GetFirstName] est revenu repu, l'haleine pleine de laine brûlée. Un messager de [dc_neighbor.GetTitledFirstName] réclame réparation : tout un troupeau a disparu dans les flammes."
 agot_dc.0041.a: "Payez-lui ses moutons."
 agot_dc.0041.b: "Les dragons mangent ce qu'ils veulent."

 # 0051
 agot_dc.0051.t: "Une forêt de brigands"
 agot_dc.0051.desc: "[dc_vassal.GetTitledFirstName] se plaint de brigands cachés dans une forêt de ses terres et offre une bourse généreuse si [dc_dragon.GetFirstName] réduit les bois en cendres."
 agot_dc.0051.a: "Le feu purifiera tout."
 agot_dc.0051.a.wildfire: "L'incendie a gagné des villages voisins…"
 agot_dc.0051.b: "Mon dragon n'est pas un garde-chasse."

 # 0061
 agot_dc.0061.t: "Dans l'œil de la tempête"
 agot_dc.0061.desc: "Au retour d'un long vol, une tempête monstrueuse vous barre la route. Les éclairs zèbrent le ciel autour de [dc_dragon.GetFirstName]."
 agot_dc.0061.a: "Plus haut ! À travers les nuages !"
 agot_dc.0061.a.success: "Vous jaillissez au-dessus des nuages, sous un ciel d'étoiles."
 agot_dc.0061.a.struck: "La foudre vous frappe tous les deux."
 agot_dc.0061.b: "Posons-nous et attendons."

 # 0071
 agot_dc.0071.t: "Feu sur les flots"
 agot_dc.0071.desc: "En survolant la côte, vous repérez un navire pirate qui pille un village de pêcheurs. [dc_dragon.GetFirstName] n'attend pas votre ordre : le navire n'est bientôt plus qu'une torche dérivante."
 agot_dc.0071.a: "Récupérez le butin de l'épave."
 agot_dc.0071.b: "Libérez les captifs enchaînés dans la cale."

 # 0081
 agot_dc.0081.t: "La Fête du Dragon"
 agot_dc.0081.desc: "Le peuple de votre capitale a fabriqué une immense effigie de [dc_dragon.GetFirstName] en toile et en bois, et danse dans les rues en son honneur."
 agot_dc.0081.a: "Survolons la fête !"
 agot_dc.0081.b: "Un dragon n'est pas un jouet de foire."

 # Batailles
 agot_dc_battle.1001.t: "Les fuyards"
 agot_dc_battle.1001.desc: "La bataille est gagnée. Sous vous, l'ennemi brisé fuit en désordre à travers les champs. [dc_dragon.GetFirstName] gronde, impatient."
 agot_dc_battle.1001.a: "Dracarys. Qu'aucun ne rentre chez lui."
 agot_dc_battle.1001.b: "Assez. Laissez-les raconter ce qu'ils ont vu."


 agot_dc_battle.1021.t: "Entre les crocs"
 agot_dc_battle.1021.desc: "[dc_enemy_commander.GetTitledFirstName] est à terre, désarmé, et [dc_dragon.GetFirstName] le tient sous sa griffe. Il n'attend qu'un mot de vous."
 agot_dc_battle.1021.a: "Dracarys."
 agot_dc_battle.1021.b: "Laissez-le fuir. Qu'il tremble le reste de sa vie."
 agot_dc_battle.1021.c: "Relevez-vous, ser. Vous vous êtes bien battu."


 agot_dc_battle.2001.t: "La fureur du dragon"
 agot_dc_battle.2001.desc: "Rendu fou par le fracas et l'odeur du sang, [dc_dragon.GetFirstName] ne répond plus à vos ordres et crache son feu au hasard, y compris sur vos propres hommes."
 agot_dc_battle.2001.a: "Reprendre le contrôle, quoi qu'il en coûte."
 agot_dc_battle.2001.a.success: "Vous le domptez à nouveau, devant tous."
 agot_dc_battle.2001.a.failure: "Il vous échappe et brûle vos propres rangs."
 agot_dc_battle.2001.b: "Laisser le dragon fuir le champ de bataille."

 agot_dc_battle.2011.t: "Désarçonné"
 agot_dc_battle.2011.desc: "Une volée de flèches déchire vos sangles. [dc_dragon.GetFirstName] fait une embardée et vous êtes projeté dans le vide…"
 agot_dc_battle.2011.a: "Je m'accrocherai jusqu'au bout."
 agot_dc_battle.2011.b: "Je remonterai en selle dès que possible."

 agot_dc_battle.2021.t: "Couvrir la retraite"
 agot_dc_battle.2021.desc: "La bataille est perdue. Vos hommes fuient, talonnés par la cavalerie ennemie. Du haut de [dc_dragon.GetFirstName], vous pourriez leur sauver la vie."
 agot_dc_battle.2021.a: "Plongeons sur leurs poursuivants !"
 agot_dc_battle.2021.a.wounded: "Votre dragon a été blessé en couvrant la retraite."
 agot_dc_battle.2021.b: "Chacun pour soi."

 # Repris de « AGOT Dragon Events »
 agot_dc_dragon_bond_modifier: "Lien draconique"
 agot_dc_dragon_bond_modifier_desc: "Le lien entre ce cavalier et son dragon s'est renforcé."
 agot_dc_dragon_fury_modifier: "Fureur draconique"
 agot_dc_dragon_fury_modifier_desc: "Le souvenir du feu et du sang habite encore ce cavalier."
 agot_dc_dragon_wounded_modifier: "Dragon blessé"
 agot_dc_dragon_wounded_modifier_desc: "Ce cavalier a forcé son dragon blessé à reprendre le combat."
 agot_dc.0091.t: "Un dragon rétif"
 agot_dc.0091.desc: "[dc_dragon.GetFirstName] gronde et refuse de se laisser monter. Ses yeux brûlants vous défient devant toute la cour."
 agot_dc.0091.a: "Je suis son maître. Il obéira."
 agot_dc.0091.a.success: "Le dragon finit par baisser la tête."
 agot_dc.0091.a.fail: "Un coup de queue vous projette au sol."
 agot_dc.0091.b: "Laissons-lui le temps."
 agot_dc.0101.t: "Le dragon grandit"
 agot_dc.0101.desc: "[dc_dragon.GetFirstName] a encore grandi. Son ombre couvre désormais des villages entiers."
 agot_dc.0101.a: "Que le monde tremble."
 agot_dc.0121.t: "Un festin imprévu"
 agot_dc.0121.desc: "[dc_victim.GetFirstName] s'est approché trop près de [dc_dragon.GetFirstName], qui ouvre déjà la gueule…"
 agot_dc.0121.a: "Arrière, bête !"
 agot_dc.0121.a.hurt: "Vous avez été blessé en vous interposant."
 agot_dc.0121.b: "Dracarys."
 agot_dc_battle.2031.t: "Dragon blessé"
 agot_dc_battle.2031.desc: "Un carreau de scorpion a percé l'aile de [dc_dragon.GetFirstName]. La bataille est perdue et la bête saigne."
 agot_dc_battle.2031.a: "Je reste à ses côtés."
 agot_dc_battle.2031.b: "Il volera encore. Il le faut."
 agot_dc.0001.t: "La viande empoisonnée"
 agot_dc.0001.desc: "Un gardien accourt, livide : la carcasse destinée à [dc_dragon.GetFirstName] empestait la ciguë. Quelqu'un, dans votre propre château, a voulu tuer votre dragon."
 agot_dc.0001.a: "Trouvez-moi le coupable."
 agot_dc.0001.a.found: "Le traître est démasqué, et son châtiment fait trembler la cour."
 agot_dc.0001.a.lost: "La piste se perd. L'empoisonneur court toujours."
 agot_dc.0001.b: "Qu'un prisonnier goûte chacun de ses repas."
 agot_dc.0001.c: "Il en a déjà avalé une partie…"
 agot_dc.0001.c.fine: "Le feu de ses entrailles a brûlé le poison."
 agot_dc.0001.c.ill: "Le poison fait son œuvre : le dragon est malade."
 agot_dc.0011.t: "Le marché des écailles"
 agot_dc.0011.desc: "Vous découvrez que vos gardiens ramassent les écailles et les dents tombées de [dc_dragon.GetFirstName] pour les vendre en secret à des marchands d'Essos, qui en tirent des fortunes."
 agot_dc.0011.a: "Ce trafic cesse aujourd'hui."
 agot_dc.0011.b: "Je veux ma part."
 agot_dc.0011.c: "Faisons-en un commerce officiel."
 agot_dc.0111.t: "La langue des dragons"
 agot_dc.0111.desc: "Vos ordres en langue commune laissent [dc_dragon.GetFirstName] indifférent. Mais lorsqu'un vieux mestre murmure quelques mots de haut valyrien, la bête dresse aussitôt la tête."
 agot_dc.0111.a: "Mestre, enseignez-moi l'ancienne langue."
 agot_dc.0111.b: "Il apprendra à m'obéir dans ma langue."
 agot_dc_battle.1011.t: "Le convoi de bagages"
 agot_dc_battle.1011.desc: "Pendant que l'ennemi fuit, [dc_dragon.GetFirstName] fond sur son convoi de ravitaillement. Les charretiers s'enfuient, abandonnant chariots, vivres et coffres de solde."
 agot_dc_battle.1011.a: "Le trésor de guerre est à moi."
 agot_dc_battle.1011.b: "Partagez le butin avec mes soldats."
 agot_dc_battle.1011.c: "Brûlez tout. Qu'ils crèvent de faim."
 agot_dc_battle.1031.t: "Le festin du champ de bataille"
 agot_dc_battle.1031.desc: "La bataille terminée, [dc_dragon.GetFirstName] s'est gavé de chevaux morts. Repu, il refuse désormais de quitter le champ de bataille."
 agot_dc_battle.1031.a: "Laissons-le digérer."
 agot_dc_battle.1031.b: "Debout ! Nous repartons."
 agot_dc_battle.1031.c: "Qu'il dévore aussi les morts ennemis, sous les yeux de tous."
 agot_dc_battle.1041.t: "La bannière arrachée"
 agot_dc_battle.1041.desc: "En plein combat, [dc_dragon.GetFirstName] a arraché l'étendard ennemi de ses griffes. Il le dépose à vos pieds, encore fumant."
 agot_dc_battle.1041.a: "Il ornera ma grande salle."
 agot_dc_battle.1041.b: "Rendez-le à son seigneur, par courtoisie."
 agot_dc_battle.1041.c: "Brûlez-le devant ses soldats."

 # Vague 2 - modificateurs
 agot_dc_valyrian_saddle_modifier: "Selle de Valyria"
 agot_dc_valyrian_saddle_modifier_desc: "Une selle légendaire, faite pour les seigneurs dragons d'autrefois."
 agot_dc_scale_armor_modifier: "Armure d'écailles de dragon"
 agot_dc_scale_armor_modifier_desc: "Une armure forgée avec les écailles tombées de son propre dragon."
 agot_dc_minstrel_song_modifier: "Héros de ballade"
 agot_dc_minstrel_song_modifier_desc: "On chante ses exploits à dos de dragon dans toutes les tavernes."
 agot_dc_dragon_cradle_modifier: "Veillé par un dragon"
 agot_dc_dragon_cradle_modifier_desc: "Un dragon a veillé sur le berceau de cet enfant."
 agot_dc_aerial_champion_modifier: "Champion des cieux"
 agot_dc_aerial_champion_modifier_desc: "Ce personnage a remporté une course de dragons."
 agot_dc_iron_bank_debt_modifier: "Dette envers la Banque de Fer"
 agot_dc_iron_bank_debt_modifier_desc: "La Banque de Fer aura son dû."
 agot_dc_wild_dragon_county_modifier: "Dragon sauvage aux alentours"
 agot_dc_wild_dragon_county_modifier_desc: "Un dragon sauvage hante les collines voisines."

 # Vague 2 - paix
 agot_dc.0131.t: "Feu sur la flotte"
 agot_dc.0131.desc: "Une flotte ennemie approche de vos côtes. Depuis le dos de [dc_dragon.GetFirstName], ses voiles ne sont que de petites taches blanches sur la mer."
 agot_dc.0131.a: "Coulez-les tous."
 agot_dc.0131.a.success: "Les navires flambent comme des torches. La mer est à vous."
 agot_dc.0131.a.wounded: "Une baliste embarquée a touché votre dragon."
 agot_dc.0131.b: "Gardons les navires intacts : ils valent de l'or."
 agot_dc.0141.t: "Le dragon jaloux"
 agot_dc.0141.desc: "Chaque fois que [dc_spouse.GetFirstName] s'approche de vous, [dc_dragon.GetFirstName] siffle et montre les crocs. Votre dragon ne supporte pas de vous partager."
 agot_dc.0141.a: "Je vais les présenter l'un à l'autre, patiemment."
 agot_dc.0141.a.success: "Le dragon finit par accepter la présence de votre époux."
 agot_dc.0141.a.burned: "Un coup de griffe : votre époux est blessé."
 agot_dc.0141.b: "Tenez-vous loin de la fosse."
 agot_dc.0141.c: "Mon dragon passe avant tout."
 agot_dc.0151.t: "Deux dragons, une seule fosse"
 agot_dc.0151.desc: "[dc_dragon.GetFirstName] et [dc_rival_dragon.GetFirstName] se disputent la même fosse. Les gardiens n'osent plus entrer, et les murs tremblent chaque nuit."
 agot_dc.0151.a: "Séparez-les, quel qu'en soit le prix."
 agot_dc.0151.b: "Qu'ils règlent leurs comptes."
 agot_dc.0151.b.mine_wins: "Votre dragon l'emporte et impose sa loi."
 agot_dc.0151.b.rival_wins: "Votre dragon sort blessé du combat."
 agot_dc.0151.c: "Faisons-les voler ensemble."
 agot_dc.0161.t: "La selle de Valyria"
 agot_dc.0161.desc: "Un artisan lysien affirme avoir retrouvé les plans d'une selle des seigneurs dragons de Valyria. Elle coûterait une fortune."
 agot_dc.0161.a: "Fabriquez-la."
 agot_dc.0161.b: "Ma vieille selle suffit."
 agot_dc.0171.t: "Le chant du dragon"
 agot_dc.0171.desc: "Un ménestrel a composé une ballade sur vos vols avec [dc_dragon.GetFirstName]. On la chante déjà dans toutes les tavernes."
 agot_dc.0171.a: "Récompensez-le généreusement."
 agot_dc.0171.b: "Changez les paroles : le héros, c'est moi."
 agot_dc.0171.c: "Chassez ce flatteur."
 agot_dc.0181.t: "L'armure d'écailles"
 agot_dc.0181.desc: "Au fil des années, [dc_dragon.GetFirstName] a perdu assez d'écailles pour qu'un forgeron propose d'en faire une armure, plus dure que l'acier."
 agot_dc.0181.a: "Forgez-la."
 agot_dc.0181.b: "Offrons ces écailles à un allié."
 agot_dc.0191.t: "Le berceau et le dragon"
 agot_dc.0191.desc: "Les nourrices sont terrifiées : [dc_dragon.GetFirstName] s'est enroulé autour du berceau de [dc_baby.GetFirstName] et refuse de bouger. Il ne grogne pas. Il veille."
 agot_dc.0191.a: "C'est un présage : cet enfant volera un jour."
 agot_dc.0191.b: "Éloignez cet enfant de la bête !"
 agot_dc.0201.t: "Un appétit ruineux"
 agot_dc.0201.desc: "[dc_dragon.GetFirstName] a tant grandi qu'il dévore désormais un troupeau par semaine. Votre intendant présente des comptes alarmants."
 agot_dc.0201.a: "Payez le bétail, quel qu'en soit le prix."
 agot_dc.0201.b: "Réquisitionnez les troupeaux des paysans."
 agot_dc.0201.c: "Qu'il chasse lui-même dans les montagnes."
 agot_dc.0201.c.fine: "Il revient repu, un aurochs entre les griffes."
 agot_dc.0201.c.ill: "Il revient affamé et de très mauvaise humeur."
 agot_dc.0211.t: "Les sorciers de Qarth"
 agot_dc.0211.desc: "Des envoyés aux lèvres bleues venus de Qarth vous offrent une fortune pour [dc_dragon.GetFirstName]. À défaut, ils se contenteraient de quelques fioles de son sang."
 agot_dc.0211.a: "Mon dragon n'est pas à vendre."
 agot_dc.0211.b: "Vendez-leur un peu de son sang."
 agot_dc.0211.b.ill: "La saignée a affaibli votre dragon."
 agot_dc.0211.c: "Dracarys."
 agot_dc.0221.t: "Une ombre sur les collines"
 agot_dc.0221.desc: "Des bergers affirment qu'un dragon sauvage, sans cavalier, s'est installé dans les collines près de votre capitale. [dc_dragon.GetFirstName] est agité depuis des jours."
 agot_dc.0221.a: "Chassons-le de mes terres."
 agot_dc.0221.a.success: "Le dragon sauvage s'enfuit vers d'autres cieux."
 agot_dc.0221.a.wounded: "Le combat est rude : vous êtes tous deux blessés."
 agot_dc.0221.b: "Laissons-le en paix."
 agot_dc.0231.t: "Le tournoi aérien"
 agot_dc.0231.desc: "Vos courtisans rêvent d'un spectacle sans pareil : une course de dragons autour des tours de votre château."
 agot_dc.0231.a: "Organisons la course, et j'y participe !"
 agot_dc.0231.a.win: "Vous franchissez la ligne le premier, sous les acclamations."
 agot_dc.0231.a.lose: "Vous perdez la course, mais vous avez beaucoup appris."
 agot_dc.0231.b: "On ne joue pas avec un dragon."
 agot_dc.0241.t: "Le Cheval qui vole"
 agot_dc.0241.desc: "Un khalasar dothraki vous a vu survoler les plaines sur [dc_dragon.GetFirstName]. Leur khal y voit un présage et vient à votre rencontre, chargé de présents."
 agot_dc.0241.a: "Acceptez leurs présents."
 agot_dc.0241.b: "Qu'ils s'agenouillent devant le dragon."
 agot_dc.0241.b.kneel: "Le khal s'agenouille. Son khalasar l'imite."
 agot_dc.0241.b.leave: "Le khal crache au sol et repart."
 agot_dc.0251.t: "La Banque de Fer"
 agot_dc.0251.desc: "Un émissaire de la Banque de Fer de Braavos propose un prêt considérable, garanti par… votre dragon. « La Banque de Fer aura son dû », rappelle-t-il."
 agot_dc.0251.a: "J'accepte le prêt."
 agot_dc.0251.b: "Mon dragon n'est pas une garantie."
 agot_dc.0261.t: "Au-delà du Mur"
 agot_dc.0261.desc: "Des corbeaux de la Garde de Nuit parlent de rassemblements au nord du Mur. Personne ne sait ce qui s'y trame, mais [dc_dragon.GetFirstName] pourrait le découvrir en quelques jours."
 agot_dc.0261.a: "Volons au nord du Mur."
 agot_dc.0261.a.wildlings: "Vous dispersez une bande de sauvageons."
 agot_dc.0261.a.cold: "Le froid mord votre dragon jusqu'aux os."
 agot_dc.0261.a.dead: "Vous voyez des morts qui marchent, et votre feu les réduit en cendres."
 agot_dc.0261.b: "Le Nord n'est pas mon affaire."

 # Vague 2 - batailles
 agot_dc_battle.1051.t: "Pluie de feu sur le camp"
 agot_dc_battle.1051.desc: "La nuit tombe sur l'armée vaincue. Ses feux de camp brillent dans la vallée, et [dc_dragon.GetFirstName] n'attend qu'un signe."
 agot_dc_battle.1051.a: "Brûlez tout le camp."
 agot_dc_battle.1051.b: "Seulement les tentes des chefs."
 agot_dc_battle.1061.t: "Les chevaux s'affolent"
 agot_dc_battle.1061.desc: "À l'odeur de [dc_dragon.GetFirstName], les chevaux ennemis se sont cabrés et ont jeté leurs cavaliers à terre. La charge adverse s'est brisée avant même de commencer."
 agot_dc_battle.1061.a: "Capturez les chevaux."
 agot_dc_battle.1061.b: "Poursuivez les chevaliers à pied."
 agot_dc_battle.1071.t: "Le pont en flammes"
 agot_dc_battle.1071.desc: "Les restes de l'armée ennemie se pressent vers le seul pont de la rivière. Un souffle de [dc_dragon.GetFirstName] suffirait à leur couper la retraite."
 agot_dc_battle.1071.a: "Brûlez le pont."
 agot_dc_battle.1071.b: "Épargnez le pont : la région en a besoin."
 agot_dc_battle.1081.t: "Enlèvement en plein vol"
 agot_dc_battle.1081.desc: "[dc_dragon.GetFirstName] a saisi [dc_enemy_commander.GetTitledFirstName] dans ses griffes et l'emporte dans les airs, hurlant au-dessus des deux armées."
 agot_dc_battle.1081.a: "Exigez une rançon."
 agot_dc_battle.1081.b: "Lâchez-le… au-dessus de ses propres lignes."
 agot_dc_battle.2041.t: "Désertion par terreur"
 agot_dc_battle.2041.desc: "Pendant la bataille, les cris de [dc_dragon.GetFirstName] ont terrifié vos propres levées. Des compagnies entières ont jeté leurs armes et se sont enfuies."
 agot_dc_battle.2041.a: "Faites un exemple des déserteurs."
 agot_dc_battle.2041.b: "Pardonnez-leur : leur peur était légitime."
