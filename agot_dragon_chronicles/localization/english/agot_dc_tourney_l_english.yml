l_english:
 # --- Activity ---
 agot_dc_aerial_tournament: "Aerial Tournament"
 agot_dc_aerial_tournament_host_an_a: "$host_activity_a$"
 agot_dc_aerial_tournament_desc: "Summon the realm's dragonriders for a race and jousts in the sky, as in the days of the Dance and the great tourneys of King's Landing. The nobles of the realm will come to watch the spectacle... if their nerves allow it."
 agot_dc_aerial_tournament_selection_tooltip: "Host an [GetActivityType('agot_dc_aerial_tournament').GetName] where dragonriders will compete.\n\nExpected rewards:\n$agot_dc_aerial_tournament_host_desc$"
 agot_dc_aerial_tournament_host_desc: "$BULLET_WITH_TAB$[prestige|E] gain for the host\n$BULLET_WITH_TAB$The winner receives a unique trophy and the title of Champion of the Skies\n$BULLET_WITH_TAB$Dragonrider experience for the contestants\n$BULLET_WITH_TAB$#N Risk of wounds, even deaths#!"
 agot_dc_aerial_tournament_predicted_cost: "The exact cost depends on the chosen scale and trial."
 agot_dc_aerial_tournament_destination_selection: "An #V Aerial Tournament#! can be held in any province of your domain."
 agot_dc_aerial_tournament_province_desc: "Choose the tournament location"
 agot_dc_aerial_tournament_conclusion_desc: "The [GetActivityType('agot_dc_aerial_tournament').GetName] is over. The dragons have returned to their lairs, and the name of the Champion of the Skies will be sung for a long time."
 agot_dc_aerial_tournament_conclusion_bloody: "The [GetActivityType('agot_dc_aerial_tournament').GetName] is over, but the sand of the lists has drunk blood. This day will be remembered as much for its dead and wounded as for its champion."
 agot_dc_aerial_tournament_guest_desc: "Riders and spectators"
 agot_dc_aerial_tournament_guest_help_text: "Invite the dragonriders who will compete, as well as the nobles who will watch the spectacle. Only guests riding a living dragon will take part in the trials."
 agot_dc_aerial_tournament_cooldown: "You must wait at least 5 years before hosting another Aerial Tournament!"
 TRAVEL_NAME_FOR_agot_dc_aerial_tournament: "$TRAVEL_NAME_FOR_activity_tournament$"
 agot_dc_aerial_tournament_base_cost: "Tournament preparations"
 agot_dc_aerial_tournament_rider_join_reason: "Dragonrider, eager to prove their worth"

 # --- Invite rule ---
 agot_dc_invite_rule_dragonriders: "Dragonriders"
 agot_dc_invite_rule_dragonriders_desc: "Riders of a living dragon among your vassals, your court, your close family and your liege."

 # --- Phases ---
 agot_dc_aerial_parade: "Dragon Parade"
 agot_dc_aerial_parade_desc: "The dragons parade above the crowd, scales gleaming, while heralds proclaim the name of each rider."
 agot_dc_aerial_contest: "Aerial Trials"
 agot_dc_aerial_contest_desc: "The riders face off in the sky. Wind, flame and the dragons' moods will decide as much as skill."

 # --- Options: scale ---
 agot_dc_aerial_scale: "Scale"
 agot_dc_aerial_scale_modest: "Modest"
 agot_dc_aerial_scale_modest_desc: "$EFFECT_LIST_BULLET$ Normal [prestige|E] gains\n$EFFECT_LIST_BULLET$ Masterwork trophy for the winner\n\n#weak A few banners, a wooden stand and dragons: what more could one need?#!"
 agot_dc_aerial_scale_grand: "Grandiose"
 agot_dc_aerial_scale_grand_desc: "$EFFECT_LIST_BULLET$ Increased [prestige|E] gains for the host and the winner\n$EFFECT_LIST_BULLET$ Prestigious trophy for the winner\n\n#weak Silk pavilions, minstrels, Arbor wine: a spectacle worthy of Old Valyria.#!"

 # --- Options: trial ---
 agot_dc_aerial_trial: "Trial"
 agot_dc_aerial_trial_race: "Race around the towers"
 agot_dc_aerial_trial_race_desc: "$EFFECT_LIST_BULLET$ Dragon speed matters more\n\n#weak Three laps of the walls, and the first to touch the highest spire wins.#!"
 agot_dc_aerial_trial_targets: "Burning targets"
 agot_dc_aerial_trial_targets_desc: "$EFFECT_LIST_BULLET$ Extra [gold|E] cost\n\n#weak Straw-and-pitch dummies on rafts: the rider must call “Dracarys” at just the right moment.#!"
 agot_dc_aerial_trial_joust: "Aerial joust to first blood"
 agot_dc_aerial_trial_joust_desc: "$EFFECT_LIST_BULLET$ [prowess|E] matters more\n$EFFECT_LIST_BULLET$ #N Increased risk of death#!\n\n#weak Blunted lance against blunted lance, a hundred feet above the ground. What could possibly go wrong?#!"

 # --- Log ---
 agot_dc_aerial_parade_log_title: "The parade begins"
 agot_dc_aerial_parade_log: "[CHARACTER.GetTitledFirstName] opens the tournament: the dragons parade above the crowd."
 agot_dc_aerial_winner_log_title: "The Champion of the Skies"
 agot_dc_aerial_winner_log: "[CHARACTER.GetTitledFirstName] wins the Aerial Tournament and receives the champion's trophy."
 agot_dc_aerial_losers_log_title: "The other contestants"
 agot_dc_aerial_losers_log: "The defeated riders leave with a little glory and a great deal of experience."
 agot_dc_aerial_host_log_title: "The tournament ends"
 agot_dc_aerial_host_log: "[CHARACTER.GetTitledFirstName] receives the praise of their guests for this tournament."

 # --- Trophy ---
 agot_dc_aerial_trophy_name: "Golden Dragon of the Skies"
 agot_dc_aerial_trophy_desc: "A gilded bronze statuette: a dragon with outspread wings leaping from a ruby-set base. Awarded to [agot_dc_trophy_winner.GetTitledFirstNameNoTooltip] for victory at the Aerial Tournament, riding [agot_dc_trophy_dragon.GetFirstNameNoTooltip]."

 # --- Events ---
 agot_dc_tourney.0001.t: "The Dragon Parade"
 agot_dc_tourney.0001.desc: "The stands are packed. Lords, ladies and smallfolk look up at the sky where the dragons wheel, while heralds proclaim the name of each rider. [dc_dragon.GetName] awaits your signal, nostrils smoking."
 agot_dc_tourney.0001.a: "I will open the parade myself!"
 agot_dc_tourney.0001.a.success: "Your low pass over the stands sets off a thunder of cheers."
 agot_dc_tourney.0001.a.fail: "[dc_dragon.GetName] snubs the crowd and lands far too early. Muffled laughter rises."
 agot_dc_tourney.0001.b: "Let the contestants parade."

 agot_dc_tourney.0011.t: "A Stubborn Dragon"
 agot_dc_tourney.0011.desc: "At the start, [dc_racer_dragon.GetName] stubbornly refuses to leave the ground. [dc_racer.GetTitledFirstName] shouts “Sōvegon!” in vain; the beast only growls, lashing the lists with its tail."
 agot_dc_tourney.0011.a: "Give the rider time to calm it."
 agot_dc_tourney.0011.b: "Force it to fly!"
 agot_dc_tourney.0011.b.flies: "The dragon finally tears itself from the ground with a furious roar."
 agot_dc_tourney.0011.b.lashes: "The dragon turns on its own rider!"

 agot_dc_tourney.0012.t: "Mid-Air Collision"
 agot_dc_tourney.0012.desc: "In the last turn around the great tower, [dc_racer_dragon.GetName] and [dc_rival_dragon.GetName] collide in a crash of scales and wings. The crowd screams as both beasts spiral down."
 agot_dc_tourney.0012.a: "Have the maesters ready!"
 agot_dc_tourney.0012.a.dragons: "The dragons break free, wounded, but the riders are safe."
 agot_dc_tourney.0012.a.riders: "Both riders are unseated and gravely wounded."
 agot_dc_tourney.0012.a.death: "One rider does not get up."

 agot_dc_tourney.0013.t: "Dragon's Blood"
 agot_dc_tourney.0013.desc: "Without warning, [dc_racer_dragon.GetName] swoops on [dc_rival_dragon.GetName], claws bared. Like Vhagar and Arrax above Shipbreaker Bay, the two dragons grapple in mid-air before the eyes of a terrified [dc_rival.GetTitledFirstName]."
 agot_dc_tourney.0013.a: "Disqualify the aggressor!"
 agot_dc_tourney.0013.b: "It is the blood of the dragon. Let it be."

 agot_dc_tourney.0014.t: "The Terrified Crowd"
 agot_dc_tourney.0014.desc: "A gout of flame from [dc_racer_dragon.GetName] grazes the common stands. Panic spreads: people trample each other, flee, children cry. When silence returns, every eye turns to you."
 agot_dc_tourney.0014.a: "Compensate the families."
 agot_dc_tourney.0014.b: "The people must learn to fear dragons."

 agot_dc_tourney.0015.t: "The Fall"
 agot_dc_tourney.0015.desc: "A gust, a snapping strap, and [dc_racer.GetTitledFirstName] slips from the saddle. The rider drops like a stone as [dc_racer_dragon.GetName] dives after them."
 agot_dc_tourney.0015.a: "May the gods protect them!"
 agot_dc_tourney.0015.a.caught: "The dragon catches its rider a few feet from the ground. The crowd erupts!"
 agot_dc_tourney.0015.a.wounded: "The rider crashes into the lists, broken but alive."
 agot_dc_tourney.0015.a.death: "The dragon arrives too late."

 agot_dc_tourney.0016.t: "The Wind Rises"
 agot_dc_tourney.0016.desc: "A violent wind from the sea shakes the banners and buffets the dragons. [dc_racer.GetTitledFirstName] signals to you: should the trials continue?"
 agot_dc_tourney.0016.a: "Delay the trial by a day."
 agot_dc_tourney.0016.b: "True dragonriders fly in any weather!"
 agot_dc_tourney.0016.b.ok: "Seasoned riders master the storm; novices struggle."
 agot_dc_tourney.0016.b.hurt: "A gust hurls a rider against the walls."

 agot_dc_tourney.0020.t: "The Champion of the Skies"
 agot_dc_tourney.0020.desc: "The trials are over. Amid cheers, [agot_dc_winner.GetTitledFirstName] lands [agot_dc_winner_dragon.GetName] in the middle of the lists and kneels before you to receive the champion's prize."
 agot_dc_tourney.0020.desc_host: "The trials are over and it is you, astride [agot_dc_winner_dragon.GetName], who outflew all your rivals! The stands chant your name, and your own herald hands you the champion's prize."
 agot_dc_tourney.0020.desc_none: "The trials are over, but no rider is fit to compete anymore. The tournament ends without a winner, in an awkward silence."
 agot_dc_tourney.0020.a: "Glory to the Champion of the Skies!"
 agot_dc_tourney.0020.b: "The tournament is closed."

 agot_dc_tourney.0021.t: "Champion of the Skies"
 agot_dc_tourney.0021.desc: "You have won [host.GetTitledFirstName]'s Aerial Tournament! Riding [agot_dc_winner_dragon.GetName], you outflew every other rider, and you are awarded the Golden Dragon of the Skies."
 agot_dc_tourney.0021.a: "Let the bards sing my name!"

 agot_dc_tourney.0017.t: "The Wagers"
 agot_dc_tourney.0017.desc: "Gold changes hands in the stands: everyone is betting on [dc_racer_dragon.GetName]. Your steward suggests the host could take a cut."
 agot_dc_tourney.0017.a: "Take our share."
 agot_dc_tourney.0017.b: "I'll bet on the favorite myself."
 agot_dc_tourney.0017.b.win: "The favorite wins: your purse grows heavier."
 agot_dc_tourney.0017.b.lose: "The favorite stumbles in the wind: you lost everything."
 agot_dc_tourney.0017.c: "Gambling offends the gods. Forbid it."
 agot_dc_tourney.0018.t: "Sabotage!"
 agot_dc_tourney.0018.desc: "[dc_rival.GetTitledFirstName] storms in, furious: his dragon has refused to eat since yesterday. He accuses [dc_racer.GetTitledFirstName] of poisoning its meat."
 agot_dc_tourney.0018.a: "I want the truth. Investigate."
 agot_dc_tourney.0018.a.found: "A stablehand confesses: the accused paid him."
 agot_dc_tourney.0018.a.nothing: "The investigation finds nothing, and rumors poison the tourney."
 agot_dc_tourney.0018.b: "The accused is disqualified."
 agot_dc_tourney.0018.c: "Without proof, these accusations are worthless."
 agot_dc_tourney.0019.t: "A Wild Dragon"
 agot_dc_tourney.0019.desc: "A vast shadow passes over the arena. A riderless dragon, drawn by its kin, circles above the stands, roaring."
 agot_dc_tourney.0019.a: "To the saddle! Drive it off."
 agot_dc_tourney.0019.a.success: "The wild dragon flees toward the mountains amid cheers."
 agot_dc_tourney.0019.a.fail: "Its claws rake your dragon before it flees."
 agot_dc_tourney.0019.b: "Clear the stands!"
 agot_dc_tourney.0022.t: "A Challenge in the Sky"
 agot_dc_tourney.0022.desc: "Before the whole assembly, [dc_rival.GetTitledFirstName] raises a gauntlet: \"Let the host prove he deserves this tourney! Race me, here and now.\""
 agot_dc_tourney.0022.a: "I accept."
 agot_dc_tourney.0022.a.win: "You cross the line several lengths ahead."
 agot_dc_tourney.0022.a.lose: "Your opponent beats you before your own guests."
 agot_dc_tourney.0022.b: "A host does not compete against his guests."
