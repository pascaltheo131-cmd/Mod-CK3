l_english:
 dragon_ev.0001.t:0 "A Defiant Dragon"
 dragon_ev.0001.desc:0 "[dragon.GetFirstName] growls and refuses to be mounted, its burning eyes challenging you before the whole court."
 dragon_ev.0001.a:0 "I am its master. It will obey."
 dragon_ev.0001.a.success:0 "The dragon finally lowers its head."
 dragon_ev.0001.a.fail:0 "A lash of its tail throws you to the ground."
 dragon_ev.0001.b:0 "Give it time."
 dragon_ev.0002.t:0 "Devoured Flocks"
 dragon_ev.0002.desc:0 "Angry peasants gather at the gates: [dragon.GetFirstName] has eaten their sheep and burned their barns."
 dragon_ev.0002.a:0 "Compensate them."
 dragon_ev.0002.b:0 "Call it the dragon's tax."
 dragon_ev.0003.t:0 "The Dragon Grows"
 dragon_ev.0003.desc:0 "[dragon.GetFirstName] has grown again. Its shadow now covers whole villages."
 dragon_ev.0003.a:0 "Let the world tremble."
 dragon_ev.0004.t:0 "Dreams of Fire"
 dragon_ev.0004.desc:0 "Each night you dream of flying… through the eyes of [dragon.GetFirstName]."
 dragon_ev.0004.a:0 "Our bond grows stronger."
 dragon_ev.0004.b:0 "The maesters must know something."
 dragon_ev.0005.t:0 "An Unplanned Feast"
 dragon_ev.0005.desc:0 "[victim.GetFirstName] wandered too close to [dragon.GetFirstName], whose jaws are already opening…"
 dragon_ev.0005.a:0 "Back, beast!"
 dragon_ev.0005.b:0 "Dracarys."
 dragon_ev.0101.t:0 "Fire and Blood"
 dragon_ev.0101.desc:0 "The enemy flees in disarray. From atop [dragon.GetFirstName], you watch the routed columns below."
 dragon_ev.0101.a:0 "Dracarys!"
 dragon_ev.0101.b:0 "Spare those who flee."
 dragon_ev.0102.t:0 "Terror from the Skies"
 dragon_ev.0102.desc:0 "At the sight of [dragon.GetFirstName] diving from the clouds, whole ranks threw down their arms before the first clash."
 dragon_ev.0102.a:0 "Songs will be sung of this day."
 dragon_ev.0103.t:0 "Wounded Dragon"
 dragon_ev.0103.desc:0 "A scorpion bolt has pierced [dragon.GetFirstName]'s wing. The battle is lost and the beast bleeds."
 dragon_ev.0103.a:0 "I stay at its side."
 dragon_ev.0103.b:0 "It will fly again. It must."
 dre_dragon_fury_modifier:0 "Draconic Fury"
 dre_dragon_bond_modifier:0 "Draconic Bond"
 dre_burned_fields_modifier:0 "Scorched Fields"
 dre_dragon_wounded_modifier:0 "Wounded Dragon"
