l_french:
 dragon_ev.0001.t:0 "Un dragon rétif"
 dragon_ev.0001.desc:0 "[dragon.GetFirstName] gronde et refuse de se laisser monter. Ses yeux brûlants vous défient devant toute la cour."
 dragon_ev.0001.a:0 "Je suis son maître. Il obéira."
 dragon_ev.0001.a.success:0 "Le dragon finit par baisser la tête."
 dragon_ev.0001.a.fail:0 "Un coup de queue vous projette au sol."
 dragon_ev.0001.b:0 "Laissons-lui le temps."
 dragon_ev.0002.t:0 "Des troupeaux dévorés"
 dragon_ev.0002.desc:0 "Des paysans en colère se massent aux portes : [dragon.GetFirstName] a dévoré leurs moutons et brûlé leurs granges."
 dragon_ev.0002.a:0 "Dédommagez-les."
 dragon_ev.0002.b:0 "C'est l'impôt du dragon."
 dragon_ev.0003.t:0 "Le dragon grandit"
 dragon_ev.0003.desc:0 "[dragon.GetFirstName] a encore grandi. Son ombre couvre désormais des villages entiers."
 dragon_ev.0003.a:0 "Que le monde tremble."
 dragon_ev.0004.t:0 "Rêves de feu"
 dragon_ev.0004.desc:0 "Chaque nuit, vous rêvez que vous volez… à travers les yeux de [dragon.GetFirstName]."
 dragon_ev.0004.a:0 "Notre lien se renforce."
 dragon_ev.0004.b:0 "Les mestres doivent savoir quelque chose."
 dragon_ev.0005.t:0 "Un festin imprévu"
 dragon_ev.0005.desc:0 "[victim.GetFirstName] s'est approché trop près de [dragon.GetFirstName], qui ouvre déjà la gueule…"
 dragon_ev.0005.a:0 "Arrière, bête !"
 dragon_ev.0005.b:0 "Dracarys."
 dragon_ev.0101.t:0 "Le feu et le sang"
 dragon_ev.0101.desc:0 "L'ennemi fuit en désordre. Du haut de [dragon.GetFirstName], vous voyez les colonnes en déroute s'étirer sous vous."
 dragon_ev.0101.a:0 "Dracarys !"
 dragon_ev.0101.b:0 "Épargnez ceux qui fuient."
 dragon_ev.0102.t:0 "Terreur des cieux"
 dragon_ev.0102.desc:0 "À la vue de [dragon.GetFirstName] plongeant des nuages, des rangs entiers ont jeté leurs armes avant même le premier choc."
 dragon_ev.0102.a:0 "Les chansons parleront de ce jour."
 dragon_ev.0103.t:0 "Dragon blessé"
 dragon_ev.0103.desc:0 "Un carreau de scorpion a percé l'aile de [dragon.GetFirstName]. La bataille est perdue et la bête saigne."
 dragon_ev.0103.a:0 "Je reste à ses côtés."
 dragon_ev.0103.b:0 "Il volera encore. Il le faut."
 dre_dragon_fury_modifier:0 "Fureur draconique"
 dre_dragon_bond_modifier:0 "Lien draconique"
 dre_burned_fields_modifier:0 "Champs calcinés"
 dre_dragon_wounded_modifier:0 "Dragon blessé"
