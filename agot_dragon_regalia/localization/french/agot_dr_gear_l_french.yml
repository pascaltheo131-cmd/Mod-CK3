l_french:
 agot_dr_gear_equip_dragon_decision: "Équiper mon dragon"
 agot_dr_gear_equip_dragon_decision_desc: "Les selliers et orfèvres de ma cour peuvent parer mon dragon d'une nouvelle selle : cuir, soie, velours, garnitures d'or, d'argent ou d'acier noirci. Un dragon ne se teint pas, mais son harnais peut porter les couleurs d'une maison."
 agot_dr_gear_equip_dragon_decision_tooltip: "Choisissez la façon, les garnitures et les couleurs de la selle de votre dragon."
 agot_dr_gear_equip_dragon_decision_effect_tt: "Vous choisirez la façon de la selle, le métal des garnitures, les couleurs puis l'artisan."
 agot_dr_gear_cooldown_tt: "La dernière selle a été livrée il y a moins de trois ans."

 agot_dr_gear_style_war_tt: "Cuir épais et sombre, garnitures robustes : une selle faite pour la bataille."
 agot_dr_gear_style_travel_tt: "Cuir clair et laine : une selle légère pour les longs vols."
 agot_dr_gear_style_parade_tt: "Brocart de soie, velours et galons : une parure d'apparat."
 agot_dr_gear_style_valyrian_tt: "Soie à la valyrienne et cuir damassé, noir et rouge à l'ancienne mode de Valyria."
 agot_dr_gear_style_champion_tt: "Réservée aux vainqueurs du Tournoi aérien : soie bleu ciel et blanche, harnais d'or éclatant."
 agot_dr_gear_style_conqueror_tt: "Réservée aux conquérants : cuir damassé noir et cramoisi, chaînes d'acier noirci."

 agot_dr_gear.0001.t: "La selle de [agot_dr_gear_dragon.GetFirstName]"
 agot_dr_gear.0001.desc: "Le maître sellier attend dans la fosse, à distance prudente de [agot_dr_gear_dragon.GetFirstName]. Il ne saurait changer la forme de la selle qu'Aegon lui-même aurait reconnue, mais il peut en changer la façon : les cuirs, les étoffes, les métaux et les couleurs.\n\nQuelle façon de selle voulez-vous ?"
 agot_dr_gear.0001.a: "Une selle de guerre, cuir sombre et acier"
 agot_dr_gear.0001.b: "Une selle de voyage, cuir clair"
 agot_dr_gear.0001.c: "Une selle d'apparat, soie et velours"
 agot_dr_gear.0001.d: "Une selle à la valyrienne, noire et rouge"
 agot_dr_gear.0001.e: "Le harnais d'or du Champion des Cieux"
 agot_dr_gear.0001.f: "Le harnais du Conquérant"
 agot_dr_gear.0001.g: "Retirer la parure et reprendre la selle d'origine"
 agot_dr_gear.0001.z: "Je n'ai que faire de tout cela."

 agot_dr_gear.0002.t: "Harnais et chaînes d'apparat"
 agot_dr_gear.0002.desc: "Boucles, anneaux, rivets et chaînes d'apparat : de quel métal le harnais de [agot_dr_gear_dragon.GetFirstName] sera-t-il garni ?"
 agot_dr_gear.0002.a: "L'or, comme il sied à un seigneur des dragons"
 agot_dr_gear.0002.b: "L'argent, sobre et lumineux"
 agot_dr_gear.0002.c: "L'acier noirci, qui ne brille pas au combat"

 agot_dr_gear.0003.t: "Les couleurs de la parure"
 agot_dr_gear.0003.desc: "Le sellier présente ses étoffes et ses cuirs teints. Le dragon gardera ses propres écailles ; seule la parure portera des couleurs."
 agot_dr_gear.0003.a: "Les couleurs propres à cette façon de selle"
 agot_dr_gear.0003.b: "Aux couleurs de ma maison"
 agot_dr_gear.0003.b.tt: "Les couleurs de votre dynastie si elle compte parmi les grandes maisons connues du sellier ; sinon une teinte neutre de cuir et de lin."
 agot_dr_gear.0003.c: "Aux couleurs d'une autre grande maison…"

 agot_dr_gear.0004.t: "Les couleurs des grandes maisons"
 agot_dr_gear.0004.desc: "Le sellier connaît les couleurs de toutes les grandes maisons de Westeros. Le blason brodé, lui, demanderait un caparaçon que ses ateliers ne savent pas encore tailler."
 agot_dr_gear.0004.targaryen: "Targaryen : noir et rouge"
 agot_dr_gear.0004.velaryon: "Velaryon : vert d'eau et argent"
 agot_dr_gear.0004.lannister: "Lannister : cramoisi et or"
 agot_dr_gear.0004.stark: "Stark : gris et blanc"
 agot_dr_gear.0004.baratheon: "Baratheon : noir et or"
 agot_dr_gear.0004.arryn: "Arryn : bleu ciel et blanc"
 agot_dr_gear.0004.tully: "Tully : bleu et rouge"
 agot_dr_gear.0004.tyrell: "Tyrell : vert et or"
 agot_dr_gear.0004.martell: "Martell : orange et rouge"
 agot_dr_gear.0004.greyjoy: "Greyjoy : noir et or"
 agot_dr_gear.0004.hightower: "Hightower : gris, blanc et feu"
 agot_dr_gear.0004.neutral: "Aucune maison : cuir et lin naturels"

 agot_dr_gear.0005.t: "Le choix de l'artisan"
 agot_dr_gear.0005.desc: "Un sellier de ma cour peut se charger de l'ouvrage. Les maîtres des cités libres, eux, demandent bien davantage, mais leurs selles font parler d'elles d'un bout à l'autre du Détroit."
 agot_dr_gear.0005.a: "Un artisan local fera l'affaire"
 agot_dr_gear.0005.b: "Un maître sellier de Myr"
 agot_dr_gear.0005.c: "Un maître brodeur de Lys"
 agot_dr_gear.0005.d: "Un maître forgeron de Qohor"

 agot_dr_gear_master_saddle_modifier: "Selle de maître"
 agot_dr_gear_master_saddle_modifier_desc: "Le dragon de ce personnage porte une selle commandée à un maître des cités libres."
