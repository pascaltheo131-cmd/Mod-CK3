 agot_sh_pol_side_chosen_for_opinion:0 "S'est rangé à mes côtés"
 agot_sh_pol_side_chosen_against_opinion:0 "A choisi le camp adverse"
 agot_sh_pol_hand_jealousy_opinion:0 "Jalousie envers la maison de la Main"
 agot_sh_pol_hand_slandered_opinion:0 "Rumeurs sur la Main"
