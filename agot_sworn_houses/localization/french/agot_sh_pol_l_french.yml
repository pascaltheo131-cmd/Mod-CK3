 agot_sh_pol_regency_support_opinion:0 "Soutien pour la régence"

 # --- Modificateurs de personnage ---
 agot_sh_pol_guest_curse_modifier:0 "Maudit par le droit des invités"
 agot_sh_pol_guest_curse_modifier_desc:0 "Ce personnage a versé le sang d'un invité sous son propre toit. Ni les dieux ni les hommes ne le pardonnent."
 agot_sh_pol_ward_betrayer_modifier:0 "Gardien indigne"
 agot_sh_pol_ward_betrayer_modifier_desc:0 "Ce personnage a tué ou emprisonné un pupille confié à sa garde."
 agot_sh_pol_hand_house_modifier:0 "Maison de la Main du Roi"
 agot_sh_pol_hand_house_modifier_desc:0 "En tant que Main du Roi, ce personnage fait pleuvoir les faveurs sur sa maison."
 agot_sh_pol_bent_knee_modifier:0 "A plié le genou"
 agot_sh_pol_bent_knee_modifier_desc:0 "Ce seigneur s'est soumis après une rébellion manquée. Il garde ses terres, mais sa loyauté reste douteuse."
 agot_sh_pol_oathbreaker_modifier:0 "Parjure"
 agot_sh_pol_oathbreaker_modifier_desc:0 "Ce personnage a rompu une parole solennellement donnée. Tout Westeros le sait."
 agot_sh_pol_house_honored_modifier:0 "Maison honorée"
 agot_sh_pol_house_honored_modifier_desc:0 "La maison de ce personnage jouit d'une réputation d'honneur dans tout Westeros."
 agot_sh_pol_house_infamous_modifier:0 "Maison infâme"
 agot_sh_pol_house_infamous_modifier_desc:0 "Le nom de la maison de ce personnage est prononcé avec mépris dans tout Westeros."
