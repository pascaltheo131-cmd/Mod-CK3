 agot_sh_war_price_refused_opinion:0 "A refusé mon prix"
 agot_sh_war_zeal_praised_opinion:0 "Zèle honoré"
 agot_sh_war_rebuked_opinion:0 "Réprimandé"
 agot_sh_war_loot_generous_opinion:0 "Partage généreux du butin"
 agot_sh_war_loot_greedy_opinion:0 "A gardé tout le butin"
 agot_sh_war_loot_favoritism_opinion:0 "Exclu du partage du butin"
 agot_sh_war_ransom_seized_opinion:0 "A voulu me prendre ma rançon"
 agot_sh_war_ransom_kept_opinion:0 "M'a laissé ma prise"
 agot_sh_war_neutrality_granted_opinion:0 "A respecté ma neutralité"
 agot_sh_war_neutrality_threat_opinion:0 "M'a menacé"
 agot_sh_war_loan_granted_opinion:0 "M'a sauvé de la ruine"
 agot_sh_war_loan_refused_opinion:0 "M'a refusé un prêt"
 agot_sh_war_toll_grievance_opinion:0 "Péages abusifs"
 agot_sh_war_toll_generosity_opinion:0 "Libre passage accordé"
 agot_sh_war_winter_provisioned_opinion:0 "A pensé à nos gens en hiver"
 agot_sh_war_winter_refused_opinion:0 "Nous retient loin de chez nous en hiver"
 agot_sh_war_old_way_granted_opinion:0 "A respecté l'Antique Voie"
 agot_sh_war_old_way_denied_opinion:0 "A interdit l'Antique Voie"
 agot_sh_war_reavers_tolerated_opinion:0 "Tolère les pillards fer-nés"
 agot_sh_war_marriage_bought_opinion:0 "Alliance matrimoniale"
 agot_sh_war_marriage_spurned_opinion:0 "A méprisé notre offre de mariage"
 agot_sh_war_cadet_favored_opinion:0 "Bienveillance envers un cadet"
 agot_sh_war_cadet_sent_away_opinion:0 "M'a éloigné de ma famille"
 agot_sh_war_castellan_trusted_opinion:0 "M'a confié une forteresse"
 agot_sh_war_march_support_opinion:0 "A soutenu la marche"
 agot_sh_war_march_ignored_opinion:0 "A abandonné la marche"
