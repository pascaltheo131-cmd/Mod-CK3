l_french:
 # --- Toasts ---
 agot_sh_war_turncoat_toast:0 "Une girouette tourne avec le vent"

 # --- 0010 Le prix du ralliement ---
 agot_sh_war.0010.t:0 "Le prix du passage"
 agot_sh_war.0010.desc:0 "Les bannières sont à peine levées qu'un corbeau arrive de chez [sh_vassal.GetTitledFirstName]. Ses hommes marcheront, écrit-il, mais un seigneur prudent ne verse pas le sang des siens pour rien. Il attend un geste : de l'or, une alliance de sang ou la promesse d'une faveur.\n\nOn raconte que lord Walder Frey fit payer à Robb Stark le passage des Jumeaux d'un mariage promis. Personne n'a oublié comment cette dette fut réglée."
 agot_sh_war.0010.a:0 "Qu'on lui verse son or."
 agot_sh_war.0010.b:0 "Unissons nos maisons par un mariage."
 agot_sh_war.0010.c:0 "Je me souviendrai de sa loyauté le moment venu."
 agot_sh_war.0010.e:0 "Un vassal doit son épée, il ne la vend pas !"

 # --- 0020 Le ban et l'arrière-ban ---
 agot_sh_war.0020.t:0 "Le ban et l'arrière-ban"
 agot_sh_war.0020.desc:0 "Les corbeaux sont partis vers chaque château du royaume. Les réponses reviennent, et chacune en dit long sur celui qui l'a écrite.\n\n[ROOT.Char.MakeScope.Var('agot_sh_war_zeal_count').GetValue|0] de mes vassaux ont répondu avec zèle, bannières déployées. [ROOT.Char.MakeScope.Var('agot_sh_war_lag_count').GetValue|0] autres traînent les pieds, invoquant les moissons, les routes boueuses ou un mal opportun."
 agot_sh_war.0020.a:0 "Que l'on chante le nom des plus fidèles."
 agot_sh_war.0020.b:0 "Que les retardataires sachent que je les ai vus."
 agot_sh_war.0020.c:0 "La guerre fera le tri."

 # --- 0030 Garde de la frontière ---
 agot_sh_war.0030.t:0 "La garde de la frontière"
 agot_sh_war.0030.desc:0 "Mes éclaireurs signalent des feux au-delà de la frontière : pillards, hors-la-loi ou avant-garde ennemie, nul ne sait encore. Tenir une marche, c'est être le premier rempart du royaume, comme les Ferboys dans la Passe Osseuse ou les gardiens de Moat Cailin face aux marais."
 agot_sh_war.0030.a:0 "Sellez les chevaux, nous sortons !"
 agot_sh_war.0030.b:0 "Doublez la garde et renforcez les murs."
 agot_sh_war.0030.c:0 "Envoyez un corbeau à mon suzerain."
 agot_sh_war.0030.c.success:0 "Mon suzerain envoie des hommes et des vivres."
 agot_sh_war.0030.c.failure:0 "Mon appel reste sans réponse."

 # --- 0040 Péages ---
 agot_sh_war.0040.t:0 "Droits de passage"
 agot_sh_war.0040.desc:0 "Ma place commande l'une des rares routes de Westeros que nulle armée ni nul marchand ne peut contourner. Les Frey ont bâti leur fortune sur le péage des Jumeaux : chacun doit payer pour franchir le fleuve. Mon intendant propose de revoir nos droits de passage."
 agot_sh_war.0040.a:0 "Qu'ils paient, et cher."
 agot_sh_war.0040.b:0 "Un péage juste, ni plus ni moins."
 agot_sh_war.0040.c:0 "Libre passage pour nos amis."

 # --- 0050 Le sort des cadets ---
 agot_sh_war.0050.t:0 "Le sort d'un cadet"
 agot_sh_war.0050.desc:0 "Mon fils [sh_cadet.GetFirstName] est un homme fait, mais il n'héritera de rien. Un cadet sans terres qui s'ennuie à la cour finit en querelle, en dettes ou pire. En tant que chef de la maison, je dois décider de son avenir : le Mur, la Citadelle, le service d'un grand seigneur, ou une place à mes côtés."
 agot_sh_war.0050.a:0 "Il prendra le noir : c'est un honneur."
 agot_sh_war.0050.b:0 "Qu'il forge sa chaîne à Villevieille."
 agot_sh_war.0050.c:0 "Il servira [sh_patron.GetTitledFirstName]."
 agot_sh_war.0050.e:0 "Il restera ici, et je le doterai."

 # --- 0060 L'hiver vient ---
 agot_sh_war.0060.t:0 "L'hiver vient"
 agot_sh_war.0060.desc:0 "La neige tombe sur le Nord, et [sh_northman.GetTitledFirstName] parle au nom des seigneurs nordiens : leurs greniers sont vides, leurs gens auront faim avant le dégel, et aucun d'eux n'a envie de mourir loin de chez lui pendant une longue campagne. Ils réclament des vivres, ou le droit de rentrer avant que les routes ne soient fermées."
 agot_sh_war.0060.a:0 "Ouvrez mes greniers pour eux."
 agot_sh_war.0060.b:0 "Qu'ils rentrent avant les neiges."
 agot_sh_war.0060.c:0 "Ils resteront jusqu'à la victoire."

 # --- 0070 L'Antique Voie ---
 agot_sh_war.0070.t:0 "L'Antique Voie"
 agot_sh_war.0070.desc:0 "[sh_ironborn.GetTitledFirstName] se présente devant moi, une odeur de sel dans les cheveux. Les fer-nés, dit-il, ne paient pas le prix de l'or : ils paient le prix du fer. Il réclame pour les siens le droit de reprendre la razzia comme le veut l'Antique Voie. Mes autres vassaux des côtes, eux, se souviennent de la Rébellion de Greyjoy."
 agot_sh_war.0070.a:0 "Qu'ils prennent ce qu'ils peuvent, loin de mes terres."
 agot_sh_war.0070.b:0 "La paix du roi vaut aussi sur les flots."
 agot_sh_war.0070.c:0 "Voici de l'or. Restez chez vous."

 # --- 0080 Butin et gloire ---
 agot_sh_war.0080.t:0 "Butin et gloire"
 agot_sh_war.0080.desc:0 "La guerre est gagnée. Les chariots débordent d'armes, de chevaux et d'or pris à l'ennemi, et mes vassaux attendent leur part. Ceux qui ont saigné pour moi s'en souviendront, et ceux qui sont repartis les mains vides aussi."
 agot_sh_war.0080.a:0 "Chacun aura sa part."
 agot_sh_war.0080.b:0 "Le butin revient à la Couronne."
 agot_sh_war.0080.c:0 "Seuls ceux qui ont été fidèles seront récompensés."

 # --- 0090 Rançon des nobles ---
 agot_sh_war.0090.t:0 "Un prisonnier de choix"
 agot_sh_war.0090.desc:0 "[sh_captor.GetTitledFirstName] tient dans ses cachots [sh_prisoner.GetTitledFirstName], un grand seigneur ennemi dont la rançon vaut une fortune. On lui demande de me le livrer, mais il répond que le prisonnier est sa prise et que la rançon lui revient. Lord Karstark en a dit autant de Jaime Lannister à Vivesaigues."
 agot_sh_war.0090.a:0 "Il me le livrera. C'est un ordre."
 agot_sh_war.0090.a.yield:0 "Si [sh_captor.GetTitledFirstName] me respecte, il obéira. Sinon, il refusera."
 agot_sh_war.0090.a.refuse:0 "[sh_captor.GetTitledFirstName] refuse et garde son prisonnier."
 agot_sh_war.0090.b:0 "Qu'il le garde, mais partageons la rançon."
 agot_sh_war.0090.c:0 "La prise est à lui."

 # --- 0100 Paix séparée ---
 agot_sh_war.0100.t:0 "Une paix séparée"
 agot_sh_war.0100.desc:0 "On m'apprend que [sh_neutral.GetTitledFirstName] a envoyé des émissaires à [sh_enemy.GetTitledFirstName]. Il ne trahit pas, assure-t-il : il garde simplement ses portes fermées et ses hommes chez lui jusqu'à ce que l'issue soit claire. Ainsi le Val resta-t-il derrière ses montagnes pendant la guerre des Cinq Rois."
 agot_sh_war.0100.a:0 "Qu'il reste neutre, puisqu'il n'est bon à rien d'autre."
 agot_sh_war.0100.b:0 "Rappelez-lui ses serments, et ce qu'il en coûte de les rompre."
 agot_sh_war.0100.b.yield:0 "Il cède et rappelle ses émissaires."
 agot_sh_war.0100.b.defy:0 "Il s'enferme dans ses murs."
 agot_sh_war.0100.c:0 "Achetons ses épées."

 # --- 0110 / 0111 Châtelains ---
 agot_sh_war.0110.t:0 "Un châtelain pour [sh_county.GetName]"
 agot_sh_war.0110.desc:0 "Je tiens [sh_county.GetName], l'une des places fortes clés du royaume, mais je ne peux y résider. Harrenhal a changé tant de fois de mains que l'on dit les lieux maudits : une forteresse sans maître sûr est une forteresse déjà perdue. [sh_castellan.GetTitledFirstName] s'offre pour en être le châtelain."
 agot_sh_war.0110.a:0 "Je vous confie les clés."
 agot_sh_war.0110.b:0 "Je ne confie mes murs à personne."
 agot_sh_war.0111.t:0 "Portes ouvertes"
 agot_sh_war.0111.desc:0 "Trahison ! [sh_castellan.GetTitledFirstName], que j'avais nommé châtelain de [sh_county.GetName], a ouvert les portes à l'ennemi en échange d'or et de promesses. La place est en désordre et mon nom est la risée des tavernes."
 agot_sh_war.0111.a:0 "Aux cachots !"
 agot_sh_war.0111.b:0 "Qu'il fuie. Les dieux se chargeront de lui."

 # --- 0120 Vassal ruiné ---
 agot_sh_war.0120.t:0 "Un vassal aux abois"
 agot_sh_war.0120.desc:0 "[sh_debtor.GetTitledFirstName] est ruiné. Ses chevaliers ne sont plus payés et ses créanciers assiègent sa porte. Il vient humblement me demander un prêt."
 agot_sh_war.0120.a:0 "Je vous prête cet or. Vous me le devrez."
 agot_sh_war.0120.b:0 "Prenez-le, c'est un don."
 agot_sh_war.0120.c:0 "Je ne suis pas un banquier."

 # --- 0125 / 0126 La Couronne endettée ---
 agot_sh_war.0125.t:0 "Les coffres sont vides"
 agot_sh_war.0125.desc:0 "Mon grand argentier ne peut plus le cacher : le trésor est à sec. Il reste deux solutions : emprunter aux Lannister, dont l'or achète aussi les faveurs, ou à la Banque de Fer de Braavos, qui prête sans sourciller mais n'oublie jamais une dette."
 agot_sh_war.0125.a:0 "Les Lannister paient toujours leurs dettes, qu'ils nous prêtent."
 agot_sh_war.0125.b:0 "Envoyez un émissaire à Braavos."
 agot_sh_war.0125.c:0 "Nous ferons des économies."
 agot_sh_war.0126.t:0 "La Banque de Fer aura son dû"
 agot_sh_war.0126.desc:0 "Un émissaire de Braavos, vêtu de noir et d'une politesse glaciale, se présente à ma cour. Le prêt arrive à échéance, avec ses intérêts. La Banque de Fer ne lève pas d'armées, mais elle finance celles de mes ennemis."
 agot_sh_war.0126.a:0 "Payez-le, jusqu'au dernier sou."
 agot_sh_war.0126.b:0 "Braavos est loin. Qu'il attende."

 # --- 0130 Mariages contre or ---
 agot_sh_war.0130.t:0 "Une alliance contre de l'or"
 agot_sh_war.0130.desc:0 "[sh_suitor.GetTitledFirstName], dont les coffres sont pleins mais le sang moins illustre que le mien, propose de marier [sh_groom.GetFirstName] à [sh_bride.GetFirstName]. Il offre en échange une dot généreuse. Une maison riche achète du prestige, une maison noble achète de l'or : c'est ainsi que les Tyrell et bien d'autres sont montés si haut."
 agot_sh_war.0130.a:0 "Marché conclu."
 agot_sh_war.0130.b:0 "Notre sang vaut plus que cela."
 agot_sh_war.0130.b.accept:0 "Il paie le prix fort."
 agot_sh_war.0130.b.refuse:0 "Il se retire, offensé."
 agot_sh_war.0130.c:0 "Mon sang n'est pas à vendre."

 # --- Modificateurs ---
 agot_sh_war_marcher_modifier:0 "Seigneur des Marches"
 agot_sh_war_marcher_modifier_desc:0 "Ce seigneur tient une place frontalière clé de Westeros et en garde les passages."
 agot_sh_war_border_reinforced_modifier:0 "Garnison renforcée"
 agot_sh_war_border_reinforced_modifier_desc:0 "Les murs ont été réparés et la garde doublée."
 agot_sh_war_border_sally_modifier:0 "Vainqueur d'une sortie"
 agot_sh_war_border_sally_modifier_desc:0 "Ce seigneur a mené une sortie audacieuse au-delà de la frontière."
 agot_sh_war_heavy_tolls_modifier:0 "Péages lourds"
 agot_sh_war_heavy_tolls_modifier_desc:0 "Quiconque franchit ce passage paie le prix fort."
 agot_sh_war_fair_tolls_modifier:0 "Péages raisonnables"
 agot_sh_war_fair_tolls_modifier_desc:0 "Un droit de passage modeste rapporte sans fâcher personne."
 agot_sh_war_zealous_banner_modifier:0 "Bannière zélée"
 agot_sh_war_zealous_banner_modifier_desc:0 "Ce seigneur a répondu le premier à l'appel de son suzerain."
 agot_sh_war_neutrality_modifier:0 "Neutralité armée"
 agot_sh_war_neutrality_modifier_desc:0 "Ce seigneur garde ses portes fermées et ses hommes chez lui."
 agot_sh_war_old_way_modifier:0 "L'Antique Voie"
 agot_sh_war_old_way_modifier_desc:0 "Ce seigneur fer-né a le droit de payer le prix du fer."
 agot_sh_war_winter_hardship_modifier:0 "Campagne d'hiver"
 agot_sh_war_winter_hardship_modifier_desc:0 "Mes armées affrontent la neige et la faim."
 agot_sh_war_hoarded_spoils_modifier:0 "Butin amassé"
 agot_sh_war_hoarded_spoils_modifier_desc:0 "Le butin de guerre remplit les coffres, mais les vassaux n'ont pas oublié."
 agot_sh_war_castellan_modifier:0 "Châtelain loyal"
 agot_sh_war_castellan_modifier_desc:0 "Une place forte clé est tenue par un châtelain de confiance."
 agot_sh_war_iron_bank_debt_modifier:0 "Débiteur de la Banque de Fer"
 agot_sh_war_iron_bank_debt_modifier_desc:0 "Une partie des revenus sert à payer les intérêts dus à Braavos."
 agot_sh_war_iron_bank_wrath_modifier:0 "Courroux de la Banque de Fer"
 agot_sh_war_iron_bank_wrath_modifier_desc:0 "La Banque de Fer finance désormais les ennemis de ce seigneur."

 # --- Opinions ---
 agot_sh_war_lost_confidence_opinion:0 "Confiance ébranlée par une défaite"
 agot_sh_war_rally_opinion:0 "Rallié au vainqueur"
 agot_sh_war_war_lost_opinion:0 "Guerre perdue"
 agot_sh_war_victory_rally_opinion:0 "Rallié après la victoire"
